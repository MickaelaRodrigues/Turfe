<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turfe Amigo</title>
</head>

<body>
    <h2>A hora do turfe</h2>
    <button onclick="turfar()">Dar uma volta</button>
    <hr>
    <div id="divOutput"></div>
</body>
<script>

    function turfar() {
        divOutput.innerHTML = "";

        let nomes = ["Cavalo01", "Cavalo02", "Cavalo03", "Cavalo04", "Cavalo05"];
        let temposAcumulados = [0, 0, 0, 0, 0];
        let ultimasVoltas = [0, 0, 0, 0, 0];
        let posicaoCavalo = 0
        for (let volta = 0; volta != 7; volta++) {
            let tempoVoltaC1 = (Math.random() * (9 - 7) + 7)
            let tempoVoltaC2 = (Math.random() * (9 - 7) + 7)
            let tempoVoltaC3 = (Math.random() * (9 - 7) + 7)
            let tempoVoltaC4 = (Math.random() * (9 - 7) + 7)
            let tempoVoltaC5 = (Math.random() * (9 - 7) + 7)

            temposAcumulados[0] += tempoVoltaC1
            temposAcumulados[1] += tempoVoltaC2
            temposAcumulados[2] += tempoVoltaC3
            temposAcumulados[3] += tempoVoltaC4
            temposAcumulados[4] += tempoVoltaC5

            if (volta == 7) {
                ultimasVoltas[0] = tempoVoltaC1
                ultimasVoltas[1] = tempoVoltaC2
                ultimasVoltas[2] = tempoVoltaC3
                ultimasVoltas[3] = tempoVoltaC4
                ultimasVoltas[4] = tempoVoltaC5
            }

            divOutput.innerHTML += `Volta ${volta + 1} <br>
                                Cavalo 1 - tempo volta ${tempoVoltaC1.toFixed(1)} - Tempo Acumulado ${temposAcumulados[0].toFixed(1)}<br>
                                Cavalo2 - tempo volta ${tempoVoltaC2.toFixed(1)} - Tempo Acumulado ${temposAcumulados[1].toFixed(1)}<br>
                                Cavalo 3 - tempo volta ${tempoVoltaC3.toFixed(1)} - Tempo Acumulado ${temposAcumulados[2].toFixed(1)}<br>
                                Cavalo 4 - tempo volta ${tempoVoltaC4.toFixed(1)}- Tempo Acumulado ${temposAcumulados[3].toFixed(1)}<br>
                                Cavalo 5 - tempo volta ${tempoVoltaC5.toFixed(1)}- Tempo Acumulado ${temposAcumulados[4].toFixed(1)}<br><br>
                                <hr>
                                `

        }
        divOutput.innerHTML += `<br> -------------- PÓDIO -------------- <br>`

        let vencedor = 99
        let segundoLugar = 0
        let terceiroLugar = 0

        for (let i = 0; i < temposAcumulados.length; i++) {


            if (vencedor > temposAcumulados[i]) {

                vencedor = temposAcumulados[i]
                var posicao = temposAcumulados.indexOf(temposAcumulados[i])



            }
            
    

            segundoLugar = temposAcumulados[i]
            
            if ((segundoLugar > vencedor && segundoLugar < temposAcumulados[i])) {
                
                var posicao2 = temposAcumulados.indexOf(temposAcumulados[i])
            }

            
            terceiroLugar = temposAcumulados[i]
            
            if ((terceiroLugar > segundoLugar)) {
                
                var posicao3 = temposAcumulados.indexOf(temposAcumulados[i])
            } 

        }

        
        for (let i = 0; i < temposAcumulados.length; i++) {
            
            if (vencedor > temposAcumulados[i]) {

                vencedor = temposAcumulados[i]
                var posicao = temposAcumulados.indexOf(temposAcumulados[i])

            }
        }


        
        divOutput.innerHTML += ` 1º Lugar ${nomes[posicao]} - com o tempo total de corrida: ${vencedor.toFixed(1)}<br>`
        divOutput.innerHTML += ` 2º Lugar ${nomes[posicao2]} - com o tempo total de corrida: ${segundoLugar.toFixed(1)}<br>`
        divOutput.innerHTML += ` 3º Lugar ${nomes[posicao3]} - com o tempo total de corrida: ${terceiroLugar.toFixed(1)}<br>`


    }

</script>

</html>
